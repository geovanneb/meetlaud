name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please never paste real meeting content, names, or recordings here.
        Security or privacy issues go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 16 Pro, iOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: Settings > About, or the commit you built
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording
        - Transcription
        - Speakers
        - Summaries
        - Ask
        - Library and search
        - AI models
        - Connectors
        - Widgets and Shortcuts
        - Other
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Japanese
        - Portuguese
        - Spanish
